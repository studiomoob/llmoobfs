\* Negative control of S21: index_load() stores its reading even when
\* ld.dirty is set. Must violate NoStaleHomogeneity.
SPECIFICATION Spec
CONSTANTS
    Files = {f1}
    NAttrs = 2
    NNames = 3
    MaxLinks = 1
    MaxOps = 3
    MaxTries = 2
    MaxBuilds = 2
    Retry = FALSE
    ClassifyAfterRegister = TRUE
    CheckName = TRUE
    ListMayMiss = TRUE
INVARIANTS
    TypeOK
    NoStaleHomogeneity
CHECK_DEADLOCK TRUE
