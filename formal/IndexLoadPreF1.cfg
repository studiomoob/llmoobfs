\* Regression control, F1 (journal 0266): rec_whole() asks only the state of
\* the domain, not the record's own flag. Must violate NoLostUpdate.
SPECIFICATION Spec
CONSTANTS
    Files = {f1}
    NAttrs = 2
    NNames = 3
    MaxLinks = 1
    MaxOps = 3
    MaxTries = 2
    MaxBuilds = 2
    Retry = TRUE
    ClassifyAfterRegister = TRUE
    CheckName = TRUE
    ListMayMiss = TRUE
    WholeFlag = FALSE
    UnlinkHook = TRUE
INVARIANTS
    TypeOK
    NoLostUpdate
CHECK_DEADLOCK TRUE
