\* Regression control, journal 0152: the file's own homogeneity computed
\* before the loader registers. Must violate NoStaleHomogeneity.
SPECIFICATION Spec
CONSTANTS
    Files = {f1}
    NAttrs = 2
    NNames = 3
    MaxLinks = 1
    MaxOps = 3
    MaxTries = 2
    MaxBuilds = 2
    Retry = TRUE
    ClassifyAfterRegister = FALSE
    CheckName = TRUE
    ListMayMiss = TRUE
INVARIANTS
    TypeOK
    NoStaleHomogeneity
CHECK_DEADLOCK TRUE
