\* Regression control, R2-2 (journals 0155, 0156): no name_is() check of
\* the scanned name. Must violate FreshPath.
SPECIFICATION Spec
CONSTANTS
    Files = {f1}
    NAttrs = 2
    NNames = 3
    MaxLinks = 0
    MaxOps = 3
    MaxTries = 2
    MaxBuilds = 2
    Retry = TRUE
    ClassifyAfterRegister = TRUE
    CheckName = FALSE
    ListMayMiss = TRUE
    WholeFlag = TRUE
    UnlinkHook = TRUE
INVARIANTS
    TypeOK
    FreshPath
CHECK_DEADLOCK TRUE
