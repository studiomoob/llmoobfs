\* Regression control, F2 (journal 0266): an unlink that leaves other names
\* calls no hook. Must violate FreshPath.
SPECIFICATION Spec
CONSTANTS
    Files = {f1}
    NAttrs = 2
    NNames = 3
    MaxLinks = 1
    MaxOps = 3
    MaxTries = 2
    MaxBuilds = 2
    Retry = TRUE
    ClassifyAfterRegister = TRUE
    CheckName = TRUE
    ListMayMiss = TRUE
    WholeFlag = TRUE
    UnlinkHook = FALSE
INVARIANTS
    TypeOK
    FreshPath
CHECK_DEADLOCK TRUE
