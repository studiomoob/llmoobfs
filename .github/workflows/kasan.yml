name: KASAN and lockdep
# Builds a pinned upstream 6.12 kernel with KASAN, UBSAN and lockdep using virtme-ng
# and runs the layer suite (vm/suite.sh) inside it. It is a required check of main, so the
# job starts on every pull request; the heavy steps run only when the pull request touches
# what the module is built or tested from, and otherwise the job passes at once. Also weekly
# and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  pull_request:
permissions:
  contents: read
concurrency:
  group: kasan-${{ github.ref }}
  cancel-in-progress: true
env:
  KERNEL_VERSION: 6.12.112
  KERNEL_SHA256: 164dc9d1f6c93c61a15e1f071c48379b467f2b17c469cce7223471968208ed03
jobs:
  kasan:
    name: Layer suite under KASAN/lockdep
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether the suite is needed
        id: need
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD |
             grep -qE '^(layer|vm|include|common|tests)/|^Makefile$|^\.github/workflows/kasan\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing under layer/, vm/, include/, common/, tests/, the Makefile or this workflow changed: the suite was not run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install build and guest dependencies
        if: steps.need.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential flex bison libelf-dev libssl-dev bc cpio kmod \
            qemu-system-x86 qemu-utils python3-pip python3-venv udev \
            e2fsprogs btrfs-progs xfsprogs sqlite3 libsqlite3-dev git dmsetup acl
          python3 -m pip install --user --require-hashes -r vm/kasan-requirements.txt   # virtme-ng 1.41 and deps, by hash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Let QEMU use KVM
        if: steps.need.outputs.run == 'true'
        # /dev/kvm exists on the hosted runners but belongs to group kvm, so QEMU fell back to
        # emulation (TCG), where the debug kernel sometimes reports at boot (issue #18) and the job
        # takes over an hour. The rule is the one of GitHub's changelog of 2024-04-02
        # ("Hardware accelerated Android virtualization now available").
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
          if [ -w /dev/kvm ]; then echo "KVM usable"; else echo "no KVM: QEMU will use TCG"; fi
      - name: Fetch and verify the kernel source
        if: steps.need.outputs.run == 'true'
        run: |
          mkdir -p build
          curl -fsSL -o build/linux.tar.xz "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz"
          echo "${KERNEL_SHA256}  build/linux.tar.xz" | sha256sum -c -
          mkdir -p build/linux
          tar -xJf build/linux.tar.xz -C build/linux --strip-components=1
      - name: Configure and build the kernel with KASAN and lockdep
        if: steps.need.outputs.run == 'true'
        run: |
          cd build/linux
          vng --kconfig --config ../../vm/kasan.config
          grep -E '^CONFIG_(KASAN|PROVE_LOCKING|UBSAN|EXT4_FS|BTRFS_FS|XFS_FS|DM_LOG_WRITES|DM_FLAKEY|VIRTIO_BLK)=' .config
          vng --build --verbose
      - name: Build the layer module and the test binaries against that kernel
        if: steps.need.outputs.run == 'true'
        run: |
          make layer KDIR="$PWD/build/linux"
          make attr-tools BUILD=build/vng CFLAGS="-O2 -g -static"
          make bench-tools BUILD=build/vng CFLAGS="-O2 -g -static" SQLITE_LIBS="-lsqlite3 -ldl -lpthread" && cp bench/queries-w3.txt build/vng/bench-queries-w3.txt && cp bench/sqlbase.sh build/vng/bench-sqlbase.sh && cp bench/equiv.sh build/vng/bench-equiv.sh && cp bench/run.sh build/vng/bench-run.sh
          gcc -static -O2 -Wall -Wextra -Werror tests/layer.c -o build/vng/layer
          gcc -static -O2 -Wall -Wextra -Werror -Iinclude tests/failnth.c -o build/vng/failnth
          gcc -static -O2 -Wall -Wextra -Werror tests/hostile.c -o build/vng/hostile
          gcc -static -O2 -Wall -Wextra -Werror -Iinclude tests/buildrace.c -lpthread -o build/vng/buildrace
          gcc -static -O2 -Wall -Wextra -Werror -Iinclude tests/query.c common/attr.c -o build/vng/query
          gcc -static -O2 -Wall -Wextra -Werror tests/ipc.c -o build/vng/ipc
          gcc -static -O2 -Wall -Wextra -Werror tests/reconf.c -o build/vng/reconf
          gcc -static -O2 -Wall -Wextra -Werror -Iinclude -DSQLITE_CORE tests/sqlq.c sqlite/moobfs_vtab.c common/attr.c -lsqlite3 -lm -ldl -lpthread -o build/vng/sqlq
          gcc -static -O2 -Wall -Wextra -Werror tests/idmap.c -o build/vng/idmap
          gcc -static -O2 -Itests/third_party/fsx tests/third_party/fsx/fsx.c -o build/vng/fsx
          gcc -static -O2 tests/third_party/log-writes/replay-log.c tests/third_party/log-writes/log-writes.c -o build/vng/replay-log
          cp layer/moobfs_layer.ko build/vng/
          truncate -s 64M build/vng/lower-ext4.img && mke2fs -q -F -t ext4 -b 4096 -L moob-lower build/vng/lower-ext4.img
          truncate -s 256M build/vng/lower-btrfs.img && mkfs.btrfs -q -f -L moob-lower build/vng/lower-btrfs.img
          truncate -s 300M build/vng/lower-xfs.img && mkfs.xfs -q -f -L moob-lower build/vng/lower-xfs.img
          truncate -s 64M build/vng/scratch.img build/vng/log.img
      - name: Run the layer suite inside the KASAN kernel
        if: steps.need.outputs.run == 'true'
        run: |
          cd build/linux
          R="$GITHUB_WORKSPACE"
          # one retry when the debug kernel itself reports a diagnostic while booting under
          # emulation (MOOBFS_VM_ENV_FAIL); a layer failure (MOOBFS_VM_FAIL) is never retried
          for attempt in 1 2; do
            vng --user root --cpus 2 --memory 3G --verbose \
              --rwdir "$R/build" \
              --disk "$R/build/vng/lower-ext4.img" --disk "$R/build/vng/lower-btrfs.img" \
              --disk "$R/build/vng/lower-xfs.img" --disk "$R/build/vng/scratch.img" --disk "$R/build/vng/log.img" \
              --exec "sh $R/vm/kasan-guest.sh" 2>&1 | tee "$R/build/vng/console-$attempt.log"
            cp "$R/build/vng/console-$attempt.log" "$R/build/vng/console.log"
            grep -q '^MOOBFS_VM_ENV_FAIL:' "$R/build/vng/console.log" || break
            echo "attempt $attempt: boot-time diagnostic of the debug kernel; retrying once"
          done
          grep -q '^MOOBFS_KASAN_PASS:' "$R/build/vng/console.log"
          # a negated command outside a condition does not stop a bash -e step (SC2251)
          if grep -q '^MOOBFS_VM_FAIL:' "$R/build/vng/console.log"; then exit 1; fi
          if grep -q '^MOOBFS_VM_ENV_FAIL:' "$R/build/vng/console.log"; then exit 1; fi
      - name: Preserve evidence
        if: always() && steps.need.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kasan-evidence
          path: |
            build/vng/console.log
            build/vng/dmesg.txt
            build/linux/.config
          if-no-files-found: warn
