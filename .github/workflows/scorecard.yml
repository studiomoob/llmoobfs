# SPDX-License-Identifier: GPL-2.0-only
name: OpenSSF Scorecard
# Publishes the repository's Scorecard result (badge in README.md) and uploads it to code
# scanning. With publish_results the Scorecard API rejects workflows that have top-level
# env or defaults, workflow-level write permissions, or other actions in this job; keep
# this file to the approved actions. Supported triggers: push and schedule on the default
# branch only, so the workflow cannot be exercised from a pull request.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 6'
permissions:
  contents: read
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # OIDC token required by publish_results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
