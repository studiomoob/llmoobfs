name: KASAN and lockdep (arm64, exploratory)
# The KASAN/lockdep job of kasan.yml on GitHub's arm64 runners, free for public repositories since
# August 2025: a second architecture for the module (journal 0123). Not a required check; on demand
# and weekly, until it is known whether these runners give QEMU KVM and how long a run takes. Kept
# in step with kasan.yml by hand: the build and run steps are the same. The first run (2026-10-18,
# journal 0124) found no /dev/kvm on these runners, so the guest runs under emulation (TCG) and,
# by default, only the suite step ext4; the weekly run uses that default too.
# Unlike kasan.yml (journal 0137): the guest's init is virtme-ng's bash script, since the wheel's
# virtme-ng-init is x86-64 only; the root is virtio-fs, not 9p, with build/ reached through it
# (--rw, no --rwdir); the disks are passed in reverse (virtio-mmio order); the test programs are
# copied to a guest tmpfs and run from there.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'MOOB_ONLY steps of vm/suite.sh (empty means ext4; under emulation the whole suite does not fit the time limit)'
        default: 'ext4'
  schedule:
    - cron: '47 5 * * 1'
permissions:
  contents: read
concurrency:
  group: kasan-arm64-${{ github.ref }}
  cancel-in-progress: true
env:
  KERNEL_VERSION: 6.12.112
  KERNEL_SHA256: 164dc9d1f6c93c61a15e1f071c48379b467f2b17c469cce7223471968208ed03
jobs:
  kasan:
    name: Layer suite under KASAN/lockdep (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and guest dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential flex bison libelf-dev libssl-dev bc cpio kmod \
            qemu-system-arm qemu-efi-aarch64 qemu-utils python3-pip python3-venv udev \
            e2fsprogs btrfs-progs xfsprogs sqlite3 libsqlite3-dev git dmsetup acl virtiofsd
          # virtme-ng shares the root over virtio-fs when it finds the Rust virtiofsd, and over 9p
          # otherwise; under emulation the 9p read path of 6.12 overflows the kernel stack at boot
          # (netfs read-retry recursion, journal 0137), so this job needs virtio-fs
          /usr/libexec/virtiofsd --version
          python3 -m pip install --user --require-hashes -r vm/kasan-requirements.txt   # virtme-ng 1.41 and deps, by hash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Let QEMU use KVM
        # /dev/kvm exists on the hosted runners but belongs to group kvm, so QEMU fell back to
        # emulation (TCG), where the debug kernel sometimes reports at boot (issue #18) and the job
        # takes over an hour. The rule is the one of GitHub's changelog of 2024-04-02
        # ("Hardware accelerated Android virtualization now available").
        run: |
          # the arm64 runners have no /dev/kvm (journal 0124), and udevadm fails on a missing device
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            # the trigger is asynchronous: wait for udev before checking the node's mode
            sudo udevadm settle --timeout=30
            ls -la /dev/kvm
          fi
          if [ -w /dev/kvm ]; then echo "KVM usable"; else echo "no KVM: QEMU will use TCG"; fi
      - name: Fetch and verify the kernel source
        run: |
          mkdir -p build
          curl -fsSL -o build/linux.tar.xz "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz"
          echo "${KERNEL_SHA256}  build/linux.tar.xz" | sha256sum -c -
          mkdir -p build/linux
          tar -xJf build/linux.tar.xz -C build/linux --strip-components=1
      - name: Configure and build the kernel with KASAN and lockdep
        run: |
          cd build/linux
          vng --kconfig --config ../../vm/kasan.config
          grep -E '^CONFIG_(KASAN|PROVE_LOCKING|UBSAN|EXT4_FS|BTRFS_FS|XFS_FS|DM_LOG_WRITES|DM_FLAKEY|VIRTIO_BLK|VIRTIO_FS)=' .config
          vng --build --verbose
      - name: Build the layer module and the test binaries against that kernel
        run: |
          make layer KDIR="$PWD/build/linux"
          make attr-tools BUILD=build/vng CFLAGS="-O2 -g -static"
          make bench-tools BUILD=build/vng CFLAGS="-O2 -g -static" SQLITE_LIBS="-lsqlite3 -ldl -lpthread" && cp bench/queries-w3.txt build/vng/bench-queries-w3.txt && cp bench/sqlbase.sh build/vng/bench-sqlbase.sh && cp bench/equiv.sh build/vng/bench-equiv.sh && cp bench/run.sh build/vng/bench-run.sh
          sh vm/build-tests.sh build/vng
          cp layer/moobfs_layer.ko build/vng/
          truncate -s 64M build/vng/lower-ext4.img && mke2fs -q -F -t ext4 -b 4096 -L moob-lower build/vng/lower-ext4.img
          truncate -s 256M build/vng/lower-btrfs.img && mkfs.btrfs -q -f -L moob-lower build/vng/lower-btrfs.img
          truncate -s 300M build/vng/lower-xfs.img && mkfs.xfs -q -f -L moob-lower build/vng/lower-xfs.img
          truncate -s 64M build/vng/scratch.img build/vng/log.img
      - name: Run the layer suite inside the KASAN kernel
        env:
          MOOB_ONLY: ${{ github.event.inputs.steps || 'ext4' }}
        run: |
          # the value is put inside quotes of the guest's command line below
          case "$MOOB_ONLY" in *[!abcdefghijklmnopqrstuvwxyz0123456789\ ]*) echo "steps are names of vm/suite.sh steps: $MOOB_ONLY" >&2; exit 1 ;; esac
          cd build/linux
          R="$GITHUB_WORKSPACE"
          # one retry when the debug kernel itself reports a diagnostic while booting under
          # emulation (MOOBFS_VM_ENV_FAIL); a layer failure (MOOBFS_VM_FAIL) is never retried
          # a user program killed by a signal is logged with its registers (run 39241490729: an
          # unexplained "Segmentation fault" of moobfs-attr, with nothing in dmesg)
          DIAG='echo 1 > /proc/sys/kernel/print-fatal-signals; echo 1 > /proc/sys/debug/exception-trace;'
          # The test programs run from a guest tmpfs, not from the virtio-fs root (journal 0137): run
          # from virtio-fs under emulation they died at random (SIGSEGV, SIGILL) at addresses whose
          # instruction in the file cannot fault, three runs out of three; from tmpfs the ext4 step
          # passed (run 39265856488). The disk images stay out (they are the guest's virtio disks);
          # what the guest writes in build/vng (dmesg.txt) is not written back to the host.
          # The host's checksums tell a bad copy over virtio-fs from a crash with good bytes in memory.
          (cd "$R/build/vng" && find . -maxdepth 1 -type f ! -name '*.img' ! -name '*.log' -exec sha256sum {} + > "$R/build/vng-bin.sha256")
          DIAG="$DIAG mkdir /run/moob-bin && for f in $R/build/vng/*; do case \$f in *.img) ;; *) cp -a \$f /run/moob-bin/ ;; esac; done && (cd /run/moob-bin && sha256sum -c --quiet $R/build/vng-bin.sha256 && echo 'ARM64_BIN_COPY: checksums equal to the host') && mount --bind /run/moob-bin $R/build/vng &&"
          for attempt in 1 2; do
            # --rw instead of --rwdir "$R/build": a --rwdir is always 9p in virtme-ng 1.41, and the
            # module and the test binaries are read from build/; with --rw the guest writes build/
            # through the virtio-fs root (as the runner user; /tmp stays a guest-only overlay)
            # --no-virtme-ng-init: the virtme-ng 1.41 wheel ships virtme-ng-init built for x86-64
            # only, so on arm64 the kernel cannot run it (error -8) and asks modprobe for a binfmt
            # handler; the bash virtme-init of the same package works on any architecture
            # Disks in reverse: QEMU's arm virt machine gives virtio-mmio devices to the guest in the
            # reverse order of the command line (run 39238405300: lower-ext4.img became vde), and
            # kasan-guest.sh expects vda ext4, vdb btrfs, vdc xfs, vdd scratch, vde log as on x86
            vng --user root --cpus 2 --memory 3G --verbose --rw --no-virtme-ng-init \
              --disk "$R/build/vng/log.img" --disk "$R/build/vng/scratch.img" --disk "$R/build/vng/lower-xfs.img" \
              --disk "$R/build/vng/lower-btrfs.img" --disk "$R/build/vng/lower-ext4.img" \
              --exec "$DIAG MOOB_ONLY='$MOOB_ONLY' sh $R/vm/kasan-guest.sh" 2>&1 | tee "$R/build/vng/console-$attempt.log"
            cp "$R/build/vng/console-$attempt.log" "$R/build/vng/console.log"
            grep -q 'Mounted root (virtiofs filesystem)' "$R/build/vng/console.log" || echo "warning: the guest root was not virtio-fs"
            grep -q '^MOOBFS_VM_ENV_FAIL:' "$R/build/vng/console.log" || break
            echo "attempt $attempt: boot-time diagnostic of the debug kernel; retrying once"
          done
          grep -qE '^MOOBFS_KASAN(_ONLY)?_PASS:' "$R/build/vng/console.log"
          # a negated command outside a condition does not stop a bash -e step (SC2251)
          if grep -q '^MOOBFS_VM_FAIL:' "$R/build/vng/console.log"; then exit 1; fi
          if grep -q '^MOOBFS_VM_ENV_FAIL:' "$R/build/vng/console.log"; then exit 1; fi
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kasan-arm64-evidence
          path: |
            build/vng/console.log
            build/vng/dmesg.txt
            build/linux/.config
          if-no-files-found: warn
