name: Weekly benchmark
# The on-demand index benchmark of issue #68 (bench/ondemand.sh) every week, in the disposable
# Debian 13 VM of vm/install-test/ (MOOB_TEST=bench, vm/bench-test/guest.sh) under KVM on
# GitHub's amd64 runner, once per lower filesystem (journal 0238). A trend and regression
# monitor on a shared virtual machine whose hardware changes between runs: it does not replace
# a run on other physical hardware (issue #68 stays open) and its numbers are not reference
# measurements. The job fails when the harness fails or when the counts differ from the
# reference's (bench/ondemand-summary.py); it never fails on a timing. amd64 only: arm64
# runners have no KVM (journal 0124) and the module's kernel list is amd64 only. The pattern of
# a matrix job per variant follows thumbor's release workflow (docs/references.md §36).
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/bench.yml
      - vm/bench-test/**
      - vm/install-test/run.sh
      - vm/install-test/in-container.sh
      - bench/ondemand.sh
      - bench/ondemand-summary.py
permissions:
  contents: read
concurrency:
  group: bench-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  ondemand:
    name: on-demand index, ${{ matrix.fs }} lower
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fs: [ext4, btrfs, xfs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Let QEMU use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -w /dev/kvm ]; then echo "KVM usable"; else echo "no KVM: the benchmark refuses to run under TCG"; exit 1; fi
      - name: Record the runner
        run: |
          mkdir -p build/bench-test
          {
            echo "runner: ${RUNNER_NAME:-unknown}, image ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "cpu: $(lscpu | sed -n 's/^Model name: *//p')"
            echo "cpus: $(nproc)"
            echo "memory: $(sed -n 's/^MemTotal: *//p' /proc/meminfo)"
            echo "kernel: $(uname -r)"
            echo "workspace filesystem: $(df --output=source,fstype "$GITHUB_WORKSPACE" | tail -n 1)"
            echo "disks (ROTA 1 = rotational, as the runner's hypervisor reports it):"
            lsblk -d -o NAME,ROTA,SIZE,MODEL
          } | tee build/bench-test-runner.txt
      - name: Image date of the cloud image
        id: img
        run: echo "date=$(sed -n 's/^IMG_DATE=//p' vm/install-test/in-container.sh)" >> "$GITHUB_OUTPUT"
      - name: Cache the Debian cloud image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/install-test/debian-13-generic-amd64-${{ steps.img.outputs.date }}.qcow2
          key: debian-13-generic-amd64-${{ steps.img.outputs.date }}
      - name: Run bench/ondemand.sh in the VM
        env:
          MOOB_TEST: bench
          MOOB_BENCH_FS: ${{ matrix.fs }}
        run: |
          sh vm/install-test/run.sh
          grep -q '^MOOBFS_BENCH_PASS' build/bench-test/log.txt
      - name: Summary against the reference
        if: always() && hashFiles('build/bench-test/results/times.txt') != ''
        env:
          FS: ${{ matrix.fs }}
        run: |
          # build/bench-test/ is written by root inside the container: the runner's notes go beside it
          R=build/bench-test/results
          cat "$R/system.txt" build/bench-test-runner.txt > build/bench-system.txt
          rc=0
          {
            echo "## On-demand index, $FS lower"
            echo
            echo "Trend monitor on a GitHub-hosted runner, not a reference measurement (journal 0238)."
            echo "The reference is \`bench/results/2026-10-13-macmini-ondemand/new/\` (ext4 only)."
            echo
            python3 -I bench/ondemand-summary.py bench/results/2026-10-13-macmini-ondemand/new/times.txt \
              "$R/times.txt" build/bench-system.txt || rc=$?
          } > build/bench-summary.md
          cat build/bench-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Preserve the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-ondemand-${{ matrix.fs }}
          path: |
            build/bench-test/log.txt
            build/bench-test/console-*.log
            build/bench-test/results/
            build/bench-test-runner.txt
            build/bench-system.txt
            build/bench-summary.md
          if-no-files-found: warn
          retention-days: 90
